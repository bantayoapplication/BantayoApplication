<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BANTAYO - Secure Access Portal</title>
  
  <!-- Tailwind CSS CDN with Class-based Dark Mode -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 min-h-screen text-slate-900 dark:text-slate-100 font-sans flex items-center justify-center p-6 transition-colors duration-300">

  <!-- Theme Toggle Button (Top Right) -->
  <button onclick="toggleTheme()" class="fixed top-5 right-5 p-3 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-amber-400 shadow-lg hover:scale-105 transition cursor-pointer" title="Switch Light / Dark Mode">
    <i id="theme-icon" data-lucide="sun" class="w-5 h-5"></i>
  </button>

  <div class="max-w-md w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6 transition-colors duration-300">
    <div class="text-center space-y-3">
      <img src="https://i.ibb.co/3R2011g/bantayo-logo.png" alt="BANTAYO Logo" class="w-20 h-20 object-contain mx-auto rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950" />
      <div>
        <h1 id="portal-title" class="text-xl font-black tracking-tight text-slate-900 dark:text-white">BANTAYO Sign In</h1>
        <p id="portal-subtitle" class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Sign in to access your authorized dashboard</p>
      </div>
    </div>

    <!-- Auth Form -->
    <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
      <div id="username-field" class="hidden">
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Username</label>
        <input type="text" id="username" maxlength="20" autocomplete="username" onblur="checkUsernameAvailability()" oninput="clearUsernameHint()" class="w-full text-xs p-3.5 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 text-slate-900 dark:text-white focus:border-blue-500 outline-none transition" placeholder="e.g. juan_delacruz">
        <p id="username-hint" class="hidden text-[10px] font-semibold mt-1"></p>
        <p class="text-[10px] text-slate-500 dark:text-slate-400 mt-1">3-20 characters: letters, numbers, underscore or dot (start and end with a letter or number). Each username is unique and is shown on your dashboard.</p>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
        <input type="email" id="email" required class="w-full text-xs p-3.5 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 text-slate-900 dark:text-white focus:border-blue-500 outline-none transition" placeholder="name@example.com">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Password</label>
        <input type="password" id="password" required minlength="6" class="w-full text-xs p-3.5 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 text-slate-900 dark:text-white focus:border-blue-500 outline-none transition" placeholder="••••••••">
      </div>
      
      <button type="submit" id="auth-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs py-3.5 rounded-xl transition cursor-pointer shadow-lg">
        Sign In
      </button>
    </form>

    <!-- Toggle Mode Button -->
    <div class="text-center pt-2 border-t border-slate-200 dark:border-slate-800">
      <p id="toggle-text" class="text-xs text-slate-500 dark:text-slate-400">
        Don't have an account? 
        <button type="button" onclick="toggleMode()" class="text-blue-600 dark:text-blue-400 font-bold hover:underline cursor-pointer ml-1">Register here</button>
      </p>
    </div>
  </div>

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    // Theme Manager
    function applyTheme(theme) {
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      if (theme === 'light') {
        html.classList.remove('dark');
        if (icon) icon.setAttribute('data-lucide', 'moon');
      } else {
        html.classList.add('dark');
        if (icon) icon.setAttribute('data-lucide', 'sun');
      }
      localStorage.setItem('bantayo-theme', theme);
      lucide.createIcons();
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.contains('dark');
      applyTheme(isDark ? 'light' : 'dark');
    }

    applyTheme(localStorage.getItem('bantayo-theme') || 'dark');

    // Firebase Auth & Routing
    const firebaseConfig = {
      apiKey: "AIzaSyC2WSefQ2Hs6S4AJBESDs4F5iJwPK7jVzU",
      authDomain: "bantayoapplication.firebaseapp.com",
      projectId: "bantayoapplication",
      storageBucket: "bantayoapplication.firebasestorage.app",
      messagingSenderId: "51777911890",
      appId: "1:51777911890:web:0c876b31a75ab8c0f7338b",
      measurementId: "G-5KJ7LE1KFF"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let isRegistering = false;

    // ---------- Unique usernames ----------
    // Each username is reserved as a document in the "usernames" collection (id = lowercase name),
    // so "Juan_C" and "juan_c" count as the same name.
    const USERNAME_RE = /^[A-Za-z0-9][A-Za-z0-9_.]{1,18}[A-Za-z0-9]$/;
    const USERNAME_RULES_MSG = "Username must be 3-20 characters, use only letters, numbers, underscore (_) or dot (.), and start and end with a letter or number.";

    function usernameKey(name) { return String(name).trim().toLowerCase(); }

    // true = already taken, false = free, null = could not check (offline, or rules not published yet)
    async function isUsernameTaken(name) {
      try {
        const snap = await db.collection('usernames').doc(usernameKey(name)).get();
        return snap.exists;
      } catch (err) {
        console.warn('Username check skipped:', err);
        return null;
      }
    }

    // Reserve a username for a user. Runs as a transaction so two people can never get the same name.
    async function claimUsername(name, uid) {
      const ref = db.collection('usernames').doc(usernameKey(name));
      await db.runTransaction(async (tx) => {
        const snap = await tx.get(ref);
        if (snap.exists) {
          const e = new Error('Username already taken');
          e.code = 'username-taken';
          throw e;
        }
        tx.set(ref, { uid: uid, username: name, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      });
    }

    function clearUsernameHint() {
      const hint = document.getElementById('username-hint');
      if (hint) { hint.classList.add('hidden'); hint.innerText = ''; }
    }

    async function checkUsernameAvailability() {
      const hint = document.getElementById('username-hint');
      const name = document.getElementById('username').value.trim();
      if (!hint || !name) return;

      const show = (msg, good) => {
        hint.innerText = msg;
        hint.className = 'text-[10px] font-semibold mt-1 ' + (good ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400');
      };

      if (!USERNAME_RE.test(name)) { show('✗ ' + USERNAME_RULES_MSG, false); return; }
      const taken = await isUsernameTaken(name);
      if (taken === true) show('✗ That username is already taken', false);
      else if (taken === false) show('✓ Username is available', true);
    }

    function getRoleForEmail(email) {
      return email.trim().toLowerCase().endsWith('@students.uc-bcf.edu.ph') ? 'official' : 'resident';
    }

    function toggleMode() {
      isRegistering = !isRegistering;
      const title = document.getElementById('portal-title');
      const subtitle = document.getElementById('portal-subtitle');
      const btn = document.getElementById('auth-btn');
      const toggleText = document.getElementById('toggle-text');
      const usernameField = document.getElementById('username-field');
      const usernameInput = document.getElementById('username');

      usernameField.classList.toggle('hidden', !isRegistering);
      usernameInput.required = isRegistering;

      if (isRegistering) {
        title.innerText = "Create Account";
        subtitle.innerText = "Register to report or manage community hazards";
        btn.innerText = "Register Account";
        toggleText.innerHTML = `Already have an account? <button type="button" onclick="toggleMode()" class="text-blue-600 dark:text-blue-400 font-bold hover:underline cursor-pointer ml-1">Sign in here</button>`;
      } else {
        title.innerText = "BANTAYO Sign In";
        subtitle.innerText = "Sign in to access your authorized dashboard";
        btn.innerText = "Sign In";
        toggleText.innerHTML = `Don't have an account? <button type="button" onclick="toggleMode()" class="text-blue-600 dark:text-blue-400 font-bold hover:underline cursor-pointer ml-1">Register here</button>`;
      }
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('auth-btn');

      btn.disabled = true;
      btn.innerText = isRegistering ? "Creating Account..." : "Signing In...";

      const assignedRole = getRoleForEmail(email);

      let username = '';
      if (isRegistering) {
        username = document.getElementById('username').value.trim();
        if (!USERNAME_RE.test(username)) {
          alert(USERNAME_RULES_MSG);
          btn.disabled = false;
          btn.innerText = "Register Account";
          return;
        }
      }

      try {
        let uid;

        if (isRegistering) {
          // Friendly early check (skipped quietly if it cannot be read)
          if (await isUsernameTaken(username) === true) {
            alert("That username is already taken. Please choose another one.");
            btn.disabled = false;
            btn.innerText = "Register Account";
            return;
          }

          const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
          uid = userCredential.user.uid;

          // Reserve the username. If someone grabbed it a moment ago, undo the new account.
          try {
            await claimUsername(username, uid);
          } catch (claimErr) {
            try { await userCredential.user.delete(); } catch (delErr) { console.warn('Could not undo account:', delErr); }
            throw claimErr;
          }
          // Save the username on the account itself so every page can read it instantly
          try { await userCredential.user.updateProfile({ displayName: username }); }
          catch (profileErr) { console.warn("Could not save display name:", profileErr); }
        } else {
          const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
          uid = userCredential.user.uid;
        }

        let finalRole = assignedRole;
        try {
          const userRef = db.collection("users").doc(uid);
          const userDoc = await userRef.get();

          if (!userDoc.exists) {
            await userRef.set({
              email: email,
              username: username || (firebase.auth().currentUser && firebase.auth().currentUser.displayName) || '',
              role: assignedRole,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          } else {
            // Older accounts: fill in a username if they do not have one yet
            const knownName = userDoc.data().username;
            const accountName = firebase.auth().currentUser && firebase.auth().currentUser.displayName;
            if (!knownName && accountName) {
              await userRef.update({ username: accountName });
            }
            // Accounts made before usernames were unique: reserve their name now (ignored if already taken)
            const nameToReserve = knownName || accountName;
            if (nameToReserve) {
              try { await claimUsername(nameToReserve, uid); } catch (reserveErr) { /* already reserved */ }
            }
            const dbRole = userDoc.data().role;
            if (assignedRole === 'official' && dbRole !== 'official') {
              await userRef.update({ role: 'official' });
              finalRole = 'official';
            } else {
              finalRole = dbRole || assignedRole;
            }
          }
        } catch (firestoreErr) {
          console.warn("Firestore sync skipped:", firestoreErr);
        }

        if (finalRole === 'official') {
          window.location.href = 'landing.html';
        } else {
          window.location.href = 'index.html';
        }

      } catch (err) {
        if (isRegistering && err && err.code === 'auth/email-already-in-use') {
          alert("That email is already registered. Please sign in instead.");
        } else if (isRegistering && err && err.code === 'auth/weak-password') {
          alert("Password is too weak. Use at least 6 characters.");
        } else if (isRegistering && err && err.code === 'auth/invalid-email') {
          alert("Please enter a valid email address.");
        } else if (isRegistering && err && err.code === 'username-taken') {
          alert("That username is already taken. Please choose another one.");
        } else if (isRegistering && err && err.code === 'permission-denied') {
          console.error('Username reservation blocked by Firestore rules:', err);
          alert("Could not reserve your username. (Admin: publish the Firestore rule for the 'usernames' collection.)");
        } else {
          alert(isRegistering ? "Could not create the account. Please try again." : "Incorrect password or not registered account");
        }
        btn.disabled = false;
        btn.innerText = isRegistering ? "Register Account" : "Sign In";
      }
    }
  </script>
</body>
</html>
