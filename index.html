<!DOCTYPE html>
<html lang="en" class="dark auth-pending">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover lets the app use safe-area insets on Samsung/Android -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BANTAYO - Hazard Reporting PWA</title>

  <!-- Tailwind CSS CDN with Class-based Dark Mode -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>

  <!-- Leaflet GIS Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- EXIF Reader Library (unpkg first, jsDelivr as backup) -->
  <script src="https://unpkg.com/exifreader@4/dist/exif-reader.js"></script>
  <script>
    if (typeof ExifReader === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/exifreader@4/dist/exif-reader.js"><\/script>');
    }
  </script>

  <!-- PWA Manifest & Theme -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#020617">

  <!-- Layout fix: use the real visible height (dvh) and keep clear of system bars -->
  <style>
    /* Keep the page hidden until sign-in is confirmed, so signed-out visitors never see a flash of the app */
    html.auth-pending body { visibility: hidden; }
    html, body { height: 100%; margin: 0; }
    body { height: 100vh; height: 100dvh; }
    header.app-header { padding-top: calc(0.75rem + env(safe-area-inset-top, 0px)); }
    nav.app-nav { padding-bottom: calc(0.625rem + env(safe-area-inset-bottom, 0px)); }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 h-full w-full overflow-hidden flex flex-col font-sans text-slate-900 dark:text-slate-100 transition-colors duration-300">

<!-- Full-Screen Responsive Container -->
<div class="w-full h-full flex flex-col justify-between overflow-hidden relative bg-slate-100 dark:bg-slate-950 transition-colors duration-300">

  <!-- Header -->
  <header class="app-header bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white px-6 py-3 flex justify-between items-center shadow-sm z-25 flex-shrink-0 transition-colors duration-300">
    <div class="flex items-center space-x-3">
      <img src="logo.png" alt="BANTAYO Logo" class="w-9 h-9 object-contain rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm bg-white dark:bg-slate-950" />
      <h1 class="text-base font-extrabold tracking-wide text-slate-900 dark:text-white">BANTAYO</h1>
    </div>
    <div class="flex items-center space-x-2.5">
      <!-- Notification bell with unread count -->
      <button onclick="switchTab('reports')" class="relative p-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:scale-105 transition cursor-pointer" title="Notifications">
        <i data-lucide="bell" class="w-4 h-4"></i>
        <span id="notif-badge" class="hidden absolute -top-1.5 -right-1.5 min-w-[16px] h-4 px-1 rounded-full bg-rose-600 text-white text-[9px] font-bold flex items-center justify-center">0</span>
      </button>
      <span id="role-badge" class="text-[10px] bg-blue-50 dark:bg-blue-950 text-blue-700 dark:text-blue-400 border border-blue-200 dark:border-blue-800 px-2.5 py-1 rounded-md font-semibold">Resident</span>
      
      <!-- Sun / Moon Theme Toggle Button -->
      <button onclick="toggleTheme()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-amber-400 hover:scale-105 transition cursor-pointer" title="Toggle Light / Dark Mode">
        <i id="theme-icon" data-lucide="sun" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Offline Status Banner -->
  <div id="offline-banner" class="hidden bg-rose-600 text-white text-center text-[10px] font-bold py-1 z-20 flex-shrink-0">
    ⚠️ You are currently offline. Changes will sync once reconnected.
  </div>

  <!-- Main Dynamic Screen Content Area -->
  <main id="app-content" class="flex-1 flex flex-col overflow-y-auto relative p-4">
    <!-- Dynamically managed by app.js -->
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="app-nav bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 py-2.5 px-6 flex justify-around md:justify-center md:space-x-16 items-center z-25 shadow-lg flex-shrink-0 transition-colors duration-300">
    <button onclick="switchTab('home')" data-tab="home" class="nav-btn flex flex-col items-center text-blue-600 dark:text-blue-400 transition hover:scale-105 cursor-pointer">
      <i data-lucide="home" class="w-5 h-5"></i>
      <span class="text-[10px] font-semibold mt-0.5">Home</span>
    </button>
    <button onclick="switchTab('submit')" data-tab="submit" class="nav-btn flex flex-col items-center text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition hover:scale-105 cursor-pointer">
      <i data-lucide="plus-circle" class="w-5 h-5"></i>
      <span class="text-[10px] font-semibold mt-0.5">Report</span>
    </button>
    <button onclick="switchTab('map')" data-tab="map" class="nav-btn flex flex-col items-center text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition hover:scale-105 cursor-pointer">
      <i data-lucide="map" class="w-5 h-5"></i>
      <span class="text-[10px] font-semibold mt-0.5">Hazard Map</span>
    </button>
    <button onclick="switchTab('reports')" data-tab="reports" class="nav-btn flex flex-col items-center text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition hover:scale-105 cursor-pointer">
      <i data-lucide="bell" class="w-5 h-5"></i>
      <span class="text-[10px] font-semibold mt-0.5">Notifications</span>
    </button>
    <button onclick="switchTab('profile')" data-tab="profile" class="nav-btn flex flex-col items-center text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition hover:scale-105 cursor-pointer">
      <i data-lucide="user" class="w-5 h-5"></i>
      <span class="text-[10px] font-semibold mt-0.5">Profile</span>
    </button>
  </nav>

</div>

<!-- Firebase SDKs (Compat Version) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<!-- Leaflet GIS Map JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Baguio-only map + directions helpers -->
<script src="baguio-map.js"></script>

<!-- Main Application Logic -->
<script src="app.js"></script>

<script>
  // Theme Switcher
  function applyTheme(theme) {
    const html = document.documentElement;
    const icon = document.getElementById('theme-icon');
    if (theme === 'light') {
      html.classList.remove('dark');
      if (icon) icon.setAttribute('data-lucide', 'moon');
    } else {
      html.classList.add('dark');
      if (icon) icon.setAttribute('data-lucide', 'sun');
    }
    localStorage.setItem('bantayo-theme', theme);
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }

  function toggleTheme() {
    const isDark = document.documentElement.classList.contains('dark');
    applyTheme(isDark ? 'light' : 'dark');
  }

  applyTheme(localStorage.getItem('bantayo-theme') || 'dark');

  // ROUTE GUARD
  function revealApp() { document.documentElement.classList.remove('auth-pending'); }

  firebase.auth().onAuthStateChanged((user) => {
    if (!user) {
      window.location.replace('login.html');
    } else {
      revealApp();
    }
  });

  // Safety net: never leave a blank screen if Firebase is slow to answer
  setTimeout(revealApp, 6000);

  // Profile View: the person, their own reports (never other residents' reports), and sign out
  window.profileFilter = null;
  window.setProfileFilter = function(status) {
    window.profileFilter = (window.profileFilter === status) ? null : status;
    window.renderProfileView();
  };

  window.renderProfileView = function() {
    const appContent = document.getElementById('app-content');
    if (!appContent) return;
    appContent.className = "flex-1 overflow-y-auto p-4 md:p-8";

    if (typeof filterPersonalReports === 'function') filterPersonalReports();

    const user = firebase.auth().currentUser;
    const userEmail = user ? user.email : 'Barangay Resident';
    const userName = getDisplayName(user);
    const initials = userName.substring(0, 2).toUpperCase();
    const safe = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    const f = window.profileFilter;
    const list = f ? myReports.filter(r => (r.status || 'Pending') === f) : myReports;
    const chip = (label) => `<button type="button" onclick="setProfileFilter('${label}')" class="text-[10px] font-bold px-3 py-1.5 rounded-full border cursor-pointer transition ${f === label ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-50 dark:bg-slate-950 text-slate-600 dark:text-slate-300 border-slate-300 dark:border-slate-700'}">${label}</button>`;

    appContent.innerHTML = `
      <div class="max-w-2xl w-full mx-auto space-y-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-5 flex items-center gap-4 shadow-md transition-colors">
          <div class="w-14 h-14 bg-blue-600 text-white rounded-2xl flex items-center justify-center text-base font-black tracking-wider shadow-md">
            ${safe(initials)}
          </div>
          <div class="min-w-0">
            <h2 class="text-sm font-bold text-slate-900 dark:text-white truncate">${safe(userName)}</h2>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 truncate">${safe(userEmail)}</p>
          </div>
        </div>

        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 space-y-4 shadow-md transition-colors">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">My Reports</span>
            <span class="text-xs text-blue-600 dark:text-blue-400 font-semibold">${myReports.length} Personal Report${myReports.length === 1 ? '' : 's'}</span>
          </div>
          <div class="flex flex-wrap gap-2">
            ${chip('Pending')}${chip('In Progress')}${chip('Resolved')}
          </div>
          <div class="space-y-3">
            ${myReports.length === 0
              ? '<p class="text-xs text-slate-400 italic text-center py-8">You haven\'t submitted any hazard reports yet.</p>'
              : list.length === 0
                ? `<p class="text-xs text-slate-400 italic text-center py-8">You have no ${safe(f)} reports.</p>`
                : list.map(myReportCardHtml).join('')}
          </div>
        </div>

        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 space-y-4 shadow-md transition-colors">
          <span class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider block">Account Settings</span>

          <button onclick="handleSignOut()" class="w-full bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 dark:hover:bg-rose-900/60 text-rose-700 dark:text-rose-400 font-bold text-xs py-4 px-4 rounded-2xl border border-rose-200 dark:border-rose-900/80 transition flex items-center justify-center gap-2 cursor-pointer shadow-sm">
            <i data-lucide="log-out" class="w-4 h-4"></i>
            Sign Out of Account
          </button>
        </div>
      </div>
    `;

    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }
  };

  window.handleSignOut = async function() {
    try {
      await firebase.auth().signOut();
      window.location.href = "login.html";
    } catch (err) {
      alert("Error logging out: " + err.message);
    }
  };
</script>
</body>
</html>
