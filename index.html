<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover lets the app use safe-area insets on Samsung/Android -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BANTAYO - Hazard Reporting PWA</title>

  <!-- Tailwind CSS CDN with Class-based Dark Mode -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Re-colour Tailwind's slate/blue into the BANTAYO navy + indigo palette so every screen matches
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: {
        slate: { 50:'#f3f2ff',100:'#e6e4fb',200:'#cfccf0',300:'#b3afe0',400:'#9a96cc',500:'#7f7bb3',600:'#5f5b94',700:'#3a3680',800:'#241f5a',900:'#15123d',950:'#0a0824' },
        blue:  { 50:'#f1efff',100:'#e3dfff',200:'#c9c2ff',300:'#ab9fff',400:'#9484ff',500:'#7b69fb',600:'#6556f0',700:'#5243d6',800:'#3f34a8',900:'#2f2780',950:'#1b1650' }
      } } }
    }
  </script>

  <!-- Leaflet GIS Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- EXIF Reader Library (unpkg first, jsDelivr as backup) -->
  <script src="https://unpkg.com/exifreader@4/dist/exif-reader.js"></script>
  <script>
    if (typeof ExifReader === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/exifreader@4/dist/exif-reader.js"><\/script>');
    }
  </script>

  <!-- PWA Manifest & Theme -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#020617">

  <!-- BANTAYO resident dashboard styles -->
  <style>
    html, body { height: 100%; margin: 0; }
    body { height: 100vh; height: 100dvh; background: #070520; -webkit-tap-highlight-color: transparent; }
    #app-content, .dash { -webkit-overflow-scrolling: touch; }

    /* Background: deep navy with indigo glow + waves */
    .bg-scene { position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(900px 500px at 8% -5%, rgba(110,90,255,.35), transparent 60%),
        radial-gradient(700px 500px at 100% 100%, rgba(90,70,230,.30), transparent 60%),
        linear-gradient(180deg, #0b0828 0%, #090620 60%, #0d0a30 100%); }
    .bg-scene svg { position: absolute; left: 0; bottom: 0; width: 100%; height: 22%; opacity: .9; }

    .shell { position: relative; z-index: 1; }
    header.app-header { padding-top: calc(0.6rem + env(safe-area-inset-top, 0px));
      background: rgba(12,9,40,.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(139,124,255,.18); }
    main#app-content { margin-left: 24px; padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); }

    /* ---------- Foldable navigation ---------- */
    #nav-handle { position: fixed; top: 50%; left: 0; transform: translateY(-50%); z-index: 3100;
      width: 24px; height: 64px; border-radius: 0 14px 14px 0; border: 1px solid rgba(139,124,255,.55); border-left: 0;
      background: linear-gradient(135deg, #5b4bf0, #8b7cff); color: #fff; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 20px rgba(91,75,240,.45); cursor: pointer; transition: left .32s cubic-bezier(.4,0,.2,1); padding: 0; }
    #nav-handle svg { width: 18px; height: 18px; transition: transform .32s; }
    body.nav-open #nav-handle { left: min(17rem, 82vw); }
    body.nav-open #nav-handle svg { transform: rotate(180deg); }

    #nav-panel { position: fixed; top: 0; bottom: 0; left: 0; width: min(17rem, 82vw); z-index: 3050;
      transform: translateX(-102%); transition: transform .32s cubic-bezier(.4,0,.2,1);
      background: linear-gradient(180deg, #16124a 0%, #0f0b36 60%, #120d40 100%);
      border-right: 1px solid rgba(139,124,255,.25); box-shadow: 12px 0 40px rgba(0,0,0,.5);
      display: flex; flex-direction: column; overflow-y: auto;
      padding: calc(1.25rem + env(safe-area-inset-top, 0px)) 1rem calc(1rem + env(safe-area-inset-bottom, 0px)); visibility: hidden; }
    body.nav-open #nav-panel { transform: translateX(0); visibility: visible; }
    #nav-backdrop { position: fixed; inset: 0; z-index: 3000; background: rgba(3,2,20,.6); opacity: 0; pointer-events: none; transition: opacity .3s; }
    body.nav-open #nav-backdrop { opacity: 1; pointer-events: auto; }

    .nav-brand { text-align: center; margin-bottom: 1.25rem; }
    .nav-brand img { width: 84px; height: 84px; object-fit: contain; border-radius: 22px; background: #fff; padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
    .nav-brand b { display: block; margin-top: .6rem; font-size: 1.35rem; letter-spacing: .02em; color: #fff; font-weight: 800; }
    .nav-brand small { color: #b9b3ee; font-size: .7rem; }
    .nav-btn { display: flex; align-items: center; gap: .9rem; width: 100%; padding: .8rem 1rem; margin-bottom: .35rem; border-radius: 14px;
      color: #c9c5f3; font-size: .95rem; font-weight: 500; background: transparent; border: 1px solid transparent; cursor: pointer; text-align: left; transition: background .2s, color .2s; }
    .nav-btn:hover { background: rgba(139,124,255,.12); color: #fff; }
    .nav-btn.nav-active { color: #fff; background: linear-gradient(90deg, #5a49ee, #7a68fb); border-color: rgba(190,180,255,.4); box-shadow: 0 6px 20px rgba(90,73,238,.4); }
    .nav-btn svg { width: 22px; height: 22px; flex-shrink: 0; }
    .nav-foot { margin-top: auto; padding-top: 1rem; text-align: center; color: #a9a4e0; font-style: italic; font-size: .8rem; }

    /* ---------- Dashboard ---------- */
    .hero { position: relative; overflow: hidden; border-radius: 26px; min-height: 170px; border: 1px solid rgba(160,145,255,.35); box-shadow: 0 14px 40px rgba(20,10,90,.5); }
    .hero-art { position: absolute; inset: 0; width: 100%; height: 100%; }
    .hero-shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,6,40,.78) 0%, rgba(10,6,40,.25) 55%, rgba(10,6,40,0) 100%); }
    .hero-text { position: relative; padding: 2rem 1.5rem; }
    .hero-title { font-size: clamp(1.5rem, 5vw, 2.4rem); font-weight: 800; color: #fff; line-height: 1.1; word-break: break-word; max-width: 80%; }
    .hero-sub { margin-top: .4rem; color: #e1dcff; font-size: clamp(.95rem, 2.6vw, 1.2rem); }
    .hero-bar { display: block; width: 84px; height: 5px; border-radius: 9px; margin-top: 1rem; background: linear-gradient(90deg, #6a58f5, #a395ff); }
    .hero-shield { position: absolute; right: 7%; top: 50%; transform: translateY(-50%); width: clamp(64px, 14vw, 140px); filter: drop-shadow(0 6px 18px rgba(80,60,220,.6)); }

    .qa { display: flex; align-items: center; gap: .8rem; padding: 1rem 1.1rem; border-radius: 18px; color: #e6e3ff; font-weight: 600; font-size: 1rem;
      background: rgba(30,24,86,.65); border: 1px solid rgba(139,124,255,.3); cursor: pointer; transition: transform .15s, background .2s; min-height: 56px; }
    .qa:hover { transform: translateY(-2px); background: rgba(48,40,120,.75); }
    .qa-primary { background: linear-gradient(90deg, #5a49ee, #8573fd); border-color: rgba(200,190,255,.45); color: #fff; box-shadow: 0 10px 28px rgba(90,73,238,.45); }

    .stat { position: relative; overflow: hidden; display: flex; align-items: center; gap: .6rem; padding: .9rem .8rem 1.4rem; border-radius: 20px; border: 1px solid rgba(139,124,255,.25); min-height: 96px; }
    .stat-warn { background: linear-gradient(135deg, rgba(120,80,10,.55), rgba(24,18,70,.85)); border-color: rgba(245,183,59,.3); }
    .stat-prog { background: linear-gradient(135deg, rgba(10,100,70,.55), rgba(18,18,60,.9)); border-color: rgba(47,208,138,.3); }
    .stat-done { background: linear-gradient(135deg, rgba(70,50,190,.55), rgba(20,16,70,.9)); border-color: rgba(139,124,255,.4); }
    .stat-ico { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #fff; }
    .stat-warn .stat-ico { background: transparent; color: #f5b73b; }
    .stat-prog .stat-ico { background: #14a971; }
    .stat-done .stat-ico { background: #6c5cf3; }
    .stat-num { font-size: clamp(1.6rem, 5vw, 2.4rem); font-weight: 800; color: #fff; line-height: 1; }
    .stat-lbl { font-size: clamp(.62rem, 2vw, .85rem); color: #e1dcff; margin-top: .2rem; }
    .spark { position: absolute; right: 0; bottom: 0; width: 55%; height: 34%; opacity: .85; }
    @media (max-width: 420px) { .stat { flex-direction: column; align-items: flex-start; } .stat-ico { width: 34px; height: 34px; } }

    .panel { border-radius: 22px; padding: 1.1rem; background: rgba(24,19,74,.6); border: 1px solid rgba(139,124,255,.25); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: .8rem; }
    .panel-head h3 { color: #fff; font-weight: 700; font-size: 1.1rem; }
    .link-btn { display: inline-flex; align-items: center; gap: .3rem; color: #a99dff; font-weight: 600; font-size: .85rem; background: none; border: 0; cursor: pointer; }
    .link-btn:hover { color: #d2cbff; }
    .badge { background: #ef3f55; color: #fff; font-size: .7rem; font-weight: 700; border-radius: 999px; padding: .1rem .5rem; }
    .empty { text-align: center; padding: 1.6rem .5rem; color: #9a96cc; font-style: italic; font-size: .85rem; }
    .empty .link-btn { margin-top: .5rem; font-style: normal; }

    .rep { display: flex; align-items: center; gap: .9rem; padding: .7rem; border-radius: 16px; background: rgba(12,9,45,.55); border: 1px solid rgba(139,124,255,.18); margin-bottom: .6rem; }
    .rep img { width: 78px; height: 78px; border-radius: 12px; object-fit: cover; flex-shrink: 0; border: 1px solid rgba(139,124,255,.25); }
    .rep-title { color: #fff; font-weight: 600; font-size: .98rem; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .rep-meta { color: #b3afe0; font-size: .74rem; margin-top: .2rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip { display: inline-block; font-size: .72rem; font-weight: 600; padding: .12rem .65rem; border-radius: 999px; color: #fff; }
    .chip-pending { background: #6a58f5; } .chip-progress { background: #14a971; } .chip-resolved { background: #4a3fb5; border: 1px solid #8b7cff; }

    .alert-row { display: flex; gap: .8rem; padding: .75rem 0; border-top: 1px solid rgba(139,124,255,.15); }
    .alert-row:first-of-type { border-top: 0; }
    .alert-ico { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
    .alert-red { background: #ef3f55; } .alert-blue { background: #2f7bff; }
    .alert-title { color: #fff; font-weight: 600; font-size: .88rem; }
    .alert-time { color: #a9a4e0; font-size: .72rem; white-space: nowrap; }
    .alert-desc { color: #b3afe0; font-size: .78rem; margin-top: .15rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .status-bar { display: flex; align-items: center; justify-content: space-around; gap: 1rem; flex-wrap: wrap; }
    .status-sep { width: 1px; align-self: stretch; background: rgba(139,124,255,.25); }
    .status-lbl { color: #c9c5f3; font-size: .85rem; }
    .status-val { font-weight: 700; font-size: 1.25rem; display: flex; align-items: center; gap: .45rem; }
    .status-val .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .status-val.is-on { color: #4ee08f; } .status-val.is-on .dot { background: #4ee08f; box-shadow: 0 0 10px #4ee08f; }
    .status-val.is-off { color: #ff6b7d; } .status-val.is-off .dot { background: #ff6b7d; }
    .status-time { color: #e6e3ff; font-size: .95rem; }

    /* Leaflet + form fields sit nicely on the navy theme */
    input, select, textarea { color-scheme: dark; }
    input, select, textarea { font-size: 16px; }
  </style>
</head>
<body class="h-full w-full overflow-hidden flex flex-col font-sans text-slate-100">

<!-- Background scene -->
<div class="bg-scene" aria-hidden="true">
  <svg viewBox="0 0 1200 240" preserveAspectRatio="none">
    <defs><linearGradient id="bw1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a2fb8" stop-opacity=".0"/><stop offset=".5" stop-color="#6a58f5" stop-opacity=".55"/><stop offset="1" stop-color="#8b7cff" stop-opacity=".7"/></linearGradient></defs>
    <path d="M0 200 C200 120 380 250 600 190 S980 120 1200 190 V240 H0Z" fill="url(#bw1)"/>
    <path d="M0 225 C220 170 420 240 640 215 S1000 170 1200 215 V240 H0Z" fill="#3a2fb8" fill-opacity=".45"/>
  </svg>
</div>

<!-- Foldable navigation: opens only when the arrow is pressed -->
<div id="nav-backdrop" onclick="closeNav()"></div>
<button id="nav-handle" onclick="toggleNav()" aria-label="Open or close the menu" aria-expanded="false" title="Menu">
  <i data-lucide="chevron-right"></i>
</button>
<aside id="nav-panel" aria-label="Main menu">
  <div class="nav-brand">
    <img src="https://i.ibb.co/3R2011g/bantayo-logo.png" alt="BANTAYO logo" />
    <b>BANTAYO</b>
    <small>Be Aware. Stay Safe.</small>
  </div>
  <button onclick="switchTab('home')" data-tab="home" class="nav-btn nav-active"><i data-lucide="home"></i><span>Home</span></button>
  <button onclick="switchTab('submit')" data-tab="submit" class="nav-btn"><i data-lucide="alert-triangle"></i><span>Report</span></button>
  <button onclick="switchTab('map')" data-tab="map" class="nav-btn"><i data-lucide="map-pin"></i><span>GIS Map</span></button>
  <button onclick="switchTab('reports')" data-tab="reports" class="nav-btn"><i data-lucide="file-text"></i><span>Feed</span></button>
  <button onclick="switchTab('profile')" data-tab="profile" class="nav-btn"><i data-lucide="user"></i><span>Profile</span></button>
  <div class="nav-foot">A safer community,<br>together.</div>
</aside>

<!-- Full-screen container -->
<div class="shell w-full h-full flex flex-col overflow-hidden">

  <!-- Top bar -->
  <header class="app-header px-4 md:px-6 pb-2.5 flex justify-between items-center flex-shrink-0 z-20">
    <div class="flex items-center gap-3 min-w-0">
      <img src="https://i.ibb.co/3R2011g/bantayo-logo.png" alt="BANTAYO" class="w-9 h-9 object-contain rounded-xl bg-white p-0.5 shadow" />
      <h1 class="text-base font-extrabold tracking-wide text-white truncate">BANTAYO <span class="hidden sm:inline text-[10px] font-normal text-slate-400">Be Aware. Stay Safe.</span></h1>
    </div>
    <div class="flex items-center gap-3">
      <button id="pwa-install-btn" class="hidden bg-amber-400 text-slate-950 text-[10px] font-bold px-2.5 py-1 rounded-lg shadow cursor-pointer">📲 Install</button>
      <span id="role-badge" class="hidden sm:inline text-[10px] bg-indigo-500/20 text-indigo-200 border border-indigo-400/40 px-2.5 py-1 rounded-md font-semibold">Resident</span>
      <button onclick="switchTab('home'); setTimeout(function(){var a=document.getElementById('alerts-panel'); if(a) a.scrollIntoView({behavior:'smooth',block:'center'});},60)" class="relative p-1.5 text-indigo-100 cursor-pointer" aria-label="Alerts" title="Alerts">
        <i data-lucide="bell" class="w-6 h-6"></i>
        <span id="bell-dot" class="hidden absolute top-0.5 right-0.5 w-2.5 h-2.5 rounded-full bg-rose-500"></span>
      </button>
      <button onclick="switchTab('profile')" class="flex items-center gap-1.5 cursor-pointer" aria-label="Profile" title="Profile">
        <span id="avatar" class="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-300 to-indigo-600 text-white text-sm font-black flex items-center justify-center border-2 border-indigo-200/60 shadow">?</span>
        <i data-lucide="chevron-down" class="w-4 h-4 text-indigo-200 hidden sm:block"></i>
      </button>
    </div>
  </header>

  <!-- Offline Status Banner -->
  <div id="offline-banner" class="hidden bg-rose-600 text-white text-center text-[10px] font-bold py-1 z-20 flex-shrink-0">
    ⚠️ You are currently offline. Changes will sync once reconnected.
  </div>

  <!-- Main Dynamic Screen Content Area -->
  <main id="app-content" class="flex-1 flex flex-col overflow-y-auto relative p-4"></main>
</div>

<!-- Firebase SDKs (Compat Version) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<!-- Leaflet GIS Map JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Main Application Logic -->
<script src="app.js"></script>

<script>
  // The BANTAYO design is dark navy / indigo
  document.documentElement.classList.add('dark');
  if (typeof lucide !== 'undefined') lucide.createIcons();

  // Foldable navigation
  function setNav(open) {
    document.body.classList.toggle('nav-open', open);
    var h = document.getElementById('nav-handle');
    if (h) h.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  function toggleNav() { setNav(!document.body.classList.contains('nav-open')); }
  function closeNav() { setNav(false); }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeNav(); });

  function paintAvatar(user) {
    var el = document.getElementById('avatar');
    if (el) el.textContent = (typeof getDisplayName === 'function' ? getDisplayName(user) : 'R').substring(0, 2).toUpperCase();
  }

  // ROUTE GUARD
  firebase.auth().onAuthStateChanged((user) => {
    if (!user) {
      window.location.href = 'login.html';
    } else {
      paintAvatar(user);
    }
  });

  // Profile View
  window.renderProfileView = function() {
    const appContent = document.getElementById('app-content');
    if (!appContent) return;

    const user = firebase.auth().currentUser;
    const userEmail = user ? user.email : 'Barangay Resident';
    const userName = getDisplayName(user);
    const initials = userName.substring(0, 2).toUpperCase();
    const safe = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    appContent.innerHTML = `
      <div class="max-w-md w-full mx-auto space-y-4 my-auto">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-5 flex items-center gap-4 shadow-md transition-colors">
          <div class="w-14 h-14 bg-blue-600 text-white rounded-2xl flex items-center justify-center text-base font-black tracking-wider shadow-md">
            ${initials}
          </div>
          <div>
            <h2 class="text-sm font-bold text-slate-900 dark:text-white">${safe(userName)}</h2>
            <p class="text-[11px] text-slate-500 dark:text-slate-400">${safe(userEmail)}</p>
            <div class="flex items-center gap-1.5 text-xs text-emerald-600 dark:text-emerald-400 mt-1 font-medium">
              <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              Cloud Sync Active
            </div>
          </div>
        </div>

        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 space-y-4 shadow-md transition-colors">
          <span class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider block">Account Settings</span>
          
          <button onclick="handleSignOut()" class="w-full bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 dark:hover:bg-rose-900/60 text-rose-700 dark:text-rose-400 font-bold text-xs py-4 px-4 rounded-2xl border border-rose-200 dark:border-rose-900/80 transition flex items-center justify-center gap-2 cursor-pointer shadow-sm">
            <i data-lucide="log-out" class="w-4 h-4"></i>
            Sign Out of Account
          </button>
        </div>
      </div>
    `;

    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }
  };

  window.handleSignOut = async function() {
    try {
      await firebase.auth().signOut();
      window.location.href = "login.html";
    } catch (err) {
      alert("Error logging out: " + err.message);
    }
  };
</script>
</body>
</html>
